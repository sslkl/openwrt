name: ESTKme Red stock relay

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/estk-red-stock.yml'
      - 'estk-monitor/check.py'
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estk-red-stock-relay
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ESTK stock
        run: python3 estk-monitor/check.py

      - name: Commit relay status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estk-monitor/status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update ESTKme Red stock status'
          git push
