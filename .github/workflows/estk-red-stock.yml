name: ESTKme Red stock relay

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/estk-red-stock.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: estk-red-stock-relay
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse stock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p estk-monitor
          TMP="$(mktemp)"
          OUT="estk-monitor/status.json"
          NEW="$(mktemp)"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          URL='https://api.estk.me/user/shop/products/2'

          if curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 30 \
            -H 'Accept: application/json' \
            -H 'User-Agent: Mozilla/5.0 ESTK-stock-monitor/1.0' \
            "$URL" > "$TMP"; then

            ITEM="$(jq -c '.product.items[]? | select(.title == "ESTKme Red")' "$TMP" | head -n 1)"
            if [ -z "$ITEM" ]; then
              echo 'ESTKme Red not found in product.items' >&2
              exit 1
            fi

            jq -n \
              --arg product 'ESTKme Red' \
              --arg source "$URL" \
              --arg checked_at "$NOW" \
              --argjson item "$ITEM" \
              '{product:$product,source:$source,fetch_ok:true,stock:$item.stock,status:$item.status,is_presale:$item.is_presale,price:$item.price,checked_at:$checked_at,note:"ok"}' \
              > "$NEW"
          else
            if [ -s "$OUT" ] && jq -e . "$OUT" >/dev/null 2>&1; then
              jq \
                --arg checked_at "$NOW" \
                '.fetch_ok=false | .checked_at=$checked_at | .note="upstream fetch failed; retained last known values"' \
                "$OUT" > "$NEW"
            else
              jq -n \
                --arg product 'ESTKme Red' \
                --arg source "$URL" \
                --arg checked_at "$NOW" \
                '{product:$product,source:$source,fetch_ok:false,stock:null,status:null,is_presale:null,price:null,checked_at:$checked_at,note:"upstream fetch failed; no prior value"}' \
                > "$NEW"
            fi
          fi

          mv "$NEW" "$OUT"
          cat "$OUT"

      - name: Commit relay status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estk-monitor/status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update ESTKme Red stock status'
          git push
