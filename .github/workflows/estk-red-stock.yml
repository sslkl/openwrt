name: ESTKme Red stock relay (manual diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Explain status
        run: |
          echo 'Automatic cloud polling is intentionally disabled.'
          echo 'ESTK returns HTTP 403 / fetch failures to GitHub-hosted cloud runners.'
          echo 'Use estk-monitor/local_check.sh from a residential/home-network host instead.'
